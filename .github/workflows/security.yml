# Łańcuch dostaw i testy: audyt zależności (pip-audit, npm audit), zgodność lockfile'ów, testy, build.
# Uruchamia się przy pushu/PR oraz co tydzień (nowe podatności w niezmienionych paczkach).
# Akcje przypięte pełnym SHA commita (tag w komentarzu) – przejęty tag nie podmieni kodu.
name: security-and-tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python – ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ai-engine]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Zależności serwisu (hashe wymuszone)
        run: python -m pip install --require-hashes -r ${{ matrix.service }}/requirements.lock
      - name: Narzędzia (pytest, pip-audit, uv)
        run: python -m pip install -r requirements-dev.txt
      - name: Lockfile zgodny z requirements.txt
        working-directory: ${{ matrix.service }}
        run: |
          uv pip compile requirements.txt --universal --generate-hashes --python-version 3.12 --no-header --quiet -o /tmp/requirements.lock
          diff -u requirements.lock /tmp/requirements.lock
      - name: pip-audit (pełny lockfile)
        run: python -m pip_audit -r ${{ matrix.service }}/requirements.lock --require-hashes --disable-pip
      - name: Testy
        run: python -m pytest ${{ matrix.service }}/tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Instalacja z lockfile'a (bez skryptów instalacyjnych)
        run: npm ci --ignore-scripts --no-fund
      - name: npm audit
        run: npm audit --audit-level=low
      - name: Build
        run: npm run build
